name: Live providers

# Imports merged public PRs from GitHub, GitLab, Bitbucket and Azure DevOps without tokens.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: uv run pytest -m live --no-cov tests/test_live.py
        env:
          REVIEW_HELPER_LIVE: "1"
